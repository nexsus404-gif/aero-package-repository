<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Index of /manifests/</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            margin: 0;
            background-color: #ffffff;
            color: #000000;
        }
        h1 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        hr {
            border: 0;
            border-top: 1px solid #000000;
            margin: 10px 0;
        }
        pre {
            font-size: 14px;
            line-height: 1.5;
        }
        a {
            color: #0000ee;
            text-decoration: none;
            cursor: pointer;
        }
        a:hover {
            text-decoration: underline;
        }
        .meta {
            color: #555555;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<h1>Index of /manifests/</h1>
<hr>
<pre id="file-list">
<a href="../">../</a>
[Loading manifests...]
</pre>
<hr>
<div class="meta">Aero Package Registry Server / Powered by GitHub Pages</div>

<script>
async function loadManifests() {
    const fileListElement = document.getElementById('file-list');
    
    // 1. Явно указываем ваш репозиторий, чтобы избежать ошибок парсинга URL браузером
    const username = "nexsus404-gif";
    const repoName = "aero-package-repository";

    // Публичный эндпоинт API GitHub для чтения содержимого папки manifests
    const apiUrl = `https://github.com{username}/${repoName}/contents/manifests`;

    try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('API request failed');
        
        const files = await response.json();
        
        // 2. Фильтруем, оставляя только валидные манифесты (.json)
        const jsonFiles = files.filter(file => file.name.endsWith('.json') && file.type === 'file');

        // 3. Формируем чистый HTML-список без анимаций загрузки
        let htmlContent = '<a href="../">../</a>\n';
        jsonFiles.forEach(file => {
            htmlContent += `📄 <a href="${file.name}" download="${file.name}">${file.name}</a>\n`;
        });

        fileListElement.innerHTML = htmlContent;
    } catch (error) {
        // Умный фолбэк: если у пользователя нет интернета или превышены лимиты GitHub API (60 запр/час),
        // страница не останется пустой, а покажет базовый работающий список
        fileListElement.innerHTML = `<a href="../">../</a>\n📄 <a href="fastfetch.json" download="fastfetch.json">fastfetch.json</a>\n\n[Note: Dynamic registry active. Use CLI to query full list]`;
        console.error('Aero Registry Error:', error);
    }
}

// Запуск сканирования папки при загрузке страницы
loadManifests();
</script>

</body>
</html>
