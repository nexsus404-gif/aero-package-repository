<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Index of /manifests/</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            margin: 0;
            background-color: #ffffff;
            color: #000000;
        }
        h1 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        hr {
            border: 0;
            border-top: 1px solid #000000;
            margin: 10px 0;
        }
        pre {
            font-size: 14px;
            line-height: 1.5;
        }
        a {
            color: #0000ee;
            text-decoration: none;
            cursor: pointer;
        }
        a:hover {
            text-decoration: underline;
        }
        .meta {
            color: #555555;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<h1>Index of /manifests/</h1>
<hr>
<pre id="file-list">
<a href="../">../</a>
<!-- Файлы манифестов будут загружаться сюда автоматически без задержек -->
</pre>
<hr>
<div class="meta">Aero Package Registry Server / Powered by GitHub Pages</div>

<script>
async function loadManifests() {
    const fileListElement = document.getElementById('file-list');
    
    // Автоматически определяем репозиторий на основе текущего адреса GitHub Pages
    const hostname = window.location.hostname;
    const pathParts = window.location.pathname.split('/');
    const username = hostname.split('.')[0];
    const repoName = pathParts[1]; 

    // URL для получения списка файлов в папке manifests через публичное API GitHub
    const apiUrl = `https://github.com{username}/${repoName}/contents/manifests`;

    try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('Failed to fetch repository contents');
        
        const files = await response.json();
        
        // Фильтруем файлы, оставляя только .json и исключая сам index.html
        const jsonFiles = files.filter(file => file.name.endsWith('.json') && file.type === 'file');

        // Пересобираем список ссылок. Атрибут download гарантирует скачивание без открытия в новой вкладке.
        let htmlContent = '<a href="../">../</a>\n';
        jsonFiles.forEach(file => {
            htmlContent += `📄 <a href="${file.name}" download="${file.name}">${file.name}</a>\n`;
        });

        fileListElement.innerHTML = htmlContent;
    } catch (error) {
        // Фолбэк-вариант на случай превышения лимитов API у гостя — выводим базовый файл
        fileListElement.innerHTML = `<a href="../">../</a>\n📄 <a href="fastfetch.json" download>fastfetch.json</a>\n\n[Note: Dynamic listing temporary unavailable]`;
        console.error('Aero Registry Error:', error);
    }
}

// Запускаем автоматический поиск файлов при открытии страницы
loadManifests();
</script>

</body>
</html>
