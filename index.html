<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aero Package Repository</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-color: #1d1d1f;
            --text-muted: #86868b;
            --accent-color: #0071e3;
            --border-color: #d2d2d7;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --card-bg: #1d1d1f;
                --text-color: #f5f5f7;
                --text-muted: #86868b;
                --accent-color: #2997ff;
                --border-color: #424245;
            }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            text-align: center;
        }
        .logo-area {
            font-size: 48px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }
        p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            margin: 0 0 24px 0;
        }
        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 980px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="logo-area">📦</div>
        <h1>Aero Package Repository</h1>
        <p>Официальный источник манифестов и индексов для пакетного менеджера Aero на macOS.</p>
        <a href="manifests/fastfetch.json" class="btn" target="_blank">Проверить fastfetch.json</a>
    </div>
    <div class="footer">
        Powered by GitHub Pages & Actions
    </div>
</div>

</body>
</html>
